<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádio Nova Dimensão FM - Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .player-wrapper {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .metadata {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .track-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            min-height: 30px;
        }

        .artist-name {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            min-height: 20px;
        }

        .cover-image {
            width: 100%;
            max-width: 200px;
            height: 200px;
            border-radius: 10px;
            object-fit: cover;
            margin: 0 auto;
            display: block;
            background: #e9ecef;
        }

        .listeners {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .status.healthy {
            background: #d4edda;
            color: #155724;
        }

        .status.degraded {
            background: #fff3cd;
            color: #856404;
        }

        .status.unhealthy {
            background: #f8d7da;
            color: #721c24;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status.healthy .status-indicator {
            background: #28a745;
        }

        .status.degraded .status-indicator {
            background: #ffc107;
        }

        .status.unhealthy .status-indicator {
            background: #dc3545;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎙️</div>
        <h1>Rádio Nova Dimensão FM</h1>
        <p class="subtitle">Transmissão ao vivo 24/7</p>

        <div class="status" id="status">
            <span class="status-indicator"></span>
            <span id="statusText">Verificando...</span>
        </div>

        <div class="player-wrapper">
            <audio id="radioPlayer" controls>
                <source src="http://localhost:3000/api/stream" type="audio/mpeg">
                Seu navegador não suporta o elemento de áudio.
            </audio>

            <div class="metadata">
                <div class="track-name" id="trackName">
                    <span class="loading"></span> Carregando...
                </div>
                <div class="artist-name" id="artistName">Rádio Nova Dimensão FM</div>
                <img id="coverImage" class="cover-image" alt="Capa" style="display: none;">
                <div class="listeners" id="listeners"></div>
            </div>

            <div class="controls">
                <button class="btn-primary" onclick="playRadio()">▶ Play</button>
                <button class="btn-secondary" onclick="stopRadio()">⏹ Stop</button>
                <button class="btn-secondary" onclick="refreshMetadata()">🔄 Atualizar</button>
            </div>

            <div class="info">
                <div class="info-item">
                    <span>Servidor:</span>
                    <span id="serverInfo">-</span>
                </div>
                <div class="info-item">
                    <span>Qualidade:</span>
                    <span id="qualityInfo">128 kbps</span>
                </div>
                <div class="info-item">
                    <span>Última atualização:</span>
                    <span id="lastUpdate">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        const ENDPOINTS = {
            metadata: `${API_URL}/api/metadata`,
            stream: `${API_URL}/api/stream`,
            health: `${API_URL}/api/health`,
        };

        const audioPlayer = document.getElementById('radioPlayer');

        /**
         * Atualizar metadados
         */
        async function updateMetadata() {
            try {
                const response = await fetch(ENDPOINTS.metadata);
                const data = await response.json();

                if (data.success) {
                    const metadata = data.data;

                    // Atualizar nome da música
                    document.getElementById('trackName').textContent = metadata.currentTrack;

                    // Atualizar artista
                    document.getElementById('artistName').textContent = metadata.artist;

                    // Atualizar capa
                    const coverImage = document.getElementById('coverImage');
                    if (metadata.cover) {
                        coverImage.src = metadata.cover;
                        coverImage.style.display = 'block';
                    } else {
                        coverImage.style.display = 'none';
                    }

                    // Atualizar ouvintes
                    if (metadata.listeners > 0) {
                        document.getElementById('listeners').textContent = 
                            `👥 ${metadata.listeners} ouvintes agora`;
                    }

                    // Atualizar timestamp
                    const now = new Date();
                    document.getElementById('lastUpdate').textContent = 
                        now.toLocaleTimeString('pt-BR');
                }
            } catch (error) {
                console.error('Erro ao atualizar metadados:', error);
            }
        }

        /**
         * Verificar saúde do serviço
         */
        async function checkHealth() {
            try {
                const response = await fetch(ENDPOINTS.health);
                const data = await response.json();

                const statusEl = document.getElementById('status');
                const statusText = document.getElementById('statusText');

                if (data.success) {
                    statusEl.className = 'status healthy';
                    statusText.textContent = '✓ Serviço online';
                    document.getElementById('serverInfo').textContent = 'Online';
                } else {
                    statusEl.className = 'status degraded';
                    statusText.textContent = '⚠ Serviço degradado';
                    document.getElementById('serverInfo').textContent = 'Degradado';
                }
            } catch (error) {
                document.getElementById('status').className = 'status unhealthy';
                document.getElementById('statusText').textContent = '✗ Serviço offline';
                document.getElementById('serverInfo').textContent = 'Offline';
                console.error('Erro ao verificar saúde:', error);
            }
        }

        /**
         * Play
         */
        function playRadio() {
            audioPlayer.play().catch(error => {
                console.error('Erro ao reproduzir:', error);
                alert('Erro ao iniciar a transmissão. Verifique a conexão.');
            });
        }

        /**
         * Stop
         */
        function stopRadio() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }

        /**
         * Atualizar metadados manualmente
         */
        function refreshMetadata() {
            updateMetadata();
            checkHealth();
        }

        /**
         * Inicialização
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Atualizar metadados imediatamente
            updateMetadata();
            checkHealth();

            // Atualizar a cada 10 segundos
            setInterval(updateMetadata, 10000);

            // Verificar saúde a cada 30 segundos
            setInterval(checkHealth, 30000);

            // Atualizar quando o player inicia
            audioPlayer.addEventListener('play', () => {
                updateMetadata();
            });
        });
    </script>
</body>
</html>
